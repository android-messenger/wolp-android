# S1 app (app/): build, JVM tests, Android lint, release build checks (S2 §7.3) with a throwaway key.
# Actions are pinned by commit (the tag is in the comment): a moved tag cannot change what runs here.
# The S2 library is a submodule of a private repo, checked out at the SHA the submodule pins with
# either a read-only deploy key (secret DEVICE_TRUST_DEPLOY_KEY; needs deploy keys allowed in the org)
# or a fine-grained token with Contents: read on wolp-device-trust (secret DEVICE_TRUST_TOKEN).
name: app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml", ".gitmodules"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml", ".gitmodules"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # CI has no real hosts: well-formed placeholders (validateWolpConfig, NSC generation). Passed as -P
      # flags: ORG_GRADLE_PROJECT_wolp.* names (with dots) do not reach Gradle from the runner.
      # The stand root: debug variants trust it, release variants must not (checked below).
      WOLP: >-
        -Pwolp.enrollUrl=https://enroll.ci.invalid
        -Pwolp.appUrl=https://app.ci.invalid
        -Pwolp.serverPins=sha256/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=,sha256/BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
        -Pwolp.extraTrustAnchor=../../p1/stand/devices/pki/stand-root.pem
        -Pwolp.uiHost=ui.ci.invalid
        -Pwolp.uiDist=build/ci-ui
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: pinned wolp-device-trust commit
        id: dt
        working-directory: .
        run: echo "sha=$(git ls-tree HEAD app/android/third_party/wolp-device-trust | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: access to wolp-device-trust (HTTP status only, the token is never printed)
        working-directory: .
        env:
          T: ${{ secrets.DEVICE_TRUST_TOKEN }}
        run: |
          [ -z "$T" ] && { echo "DEVICE_TRUST_TOKEN not set — relying on DEVICE_TRUST_DEPLOY_KEY"; exit 0; }
          # shape only (never the value): length, known prefix, stray whitespace
          prefix=other; case $T in github_pat_*) prefix=github_pat_ ;; ghp_*) prefix=ghp_ ;; esac
          ws=no; [[ "$T" =~ [[:space:]] ]] && ws=yes
          echo "token shape: length ${#T}, prefix $prefix, whitespace $ws"
          # 200 here + 401/404 below = the token is valid but not admitted to the org (owner, approval)
          echo "GET /user → $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" https://api.github.com/user)"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" https://api.github.com/repos/android-messenger/wolp-device-trust)
          echo "GET repos/android-messenger/wolp-device-trust → $code"
          case $code in
            200) ;;
            401) echo "::error::DEVICE_TRUST_TOKEN is invalid or expired (401)"; exit 1 ;;
            403|404) echo "::error::DEVICE_TRUST_TOKEN has no access to wolp-device-trust ($code): resource owner must be android-messenger, the repository selected, Contents: read, and an org approval if required"; exit 1 ;;
            *) echo "::error::unexpected $code"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: android-messenger/wolp-device-trust
          ref: ${{ steps.dt.outputs.sha }}
          path: app/android/third_party/wolp-device-trust
          ssh-key: ${{ secrets.DEVICE_TRUST_DEPLOY_KEY }}
          token: ${{ secrets.DEVICE_TRUST_TOKEN || github.token }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Capacitor native sources (npm)
        working-directory: app
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      # The packaged UI (security/09) is messenger-ui's app build, a separate repository: CI bundles a
      # stub with the same shape (index.html + assets/*.js carrying the API origin) instead.
      - name: stub UI build for wolp.uiDist
        run: |
          mkdir -p build/ci-ui/assets
          echo '<!doctype html><title>ci</title><script type="module" src="/assets/index.js"></script>' > build/ci-ui/index.html
          echo 'export const API_ORIGIN = "https://app.ci.invalid";' > build/ci-ui/assets/index.js
          echo 'self.addEventListener("push", () => {});' > build/ci-ui/push-sw.js

      - name: debug build, unit tests and Android lint
        run: ./gradlew --no-daemon $WOLP :app:assembleProductDebug :app:testProductDebugUnitTest :app:lintProductDebug

      - name: release builds (S2 §7.3) with a throwaway release key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass ci-pass -keypass ci-pass \
            -alias wolp -keyalg EC -groupname secp256r1 -sigalg SHA256withECDSA -dname "CN=ci" -validity 30
          DIGEST=$(keytool -exportcert -keystore "$RUNNER_TEMP/release.p12" -storepass ci-pass -alias wolp | sha256sum | cut -d' ' -f1)
          # a fake Firebase config: release builds refuse to build without push (S1 §7.1)
          cat > "$RUNNER_TEMP/google-services.json" <<'JSON'
          {"project_info":{"project_id":"ci","project_number":"1"},
           "client":[{"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":"org.wolpmessenger"}},
                      "api_key":[{"current_key":"ci"}]}]}
          JSON
          SIGN="-Pwolp.signing.storeFile=$RUNNER_TEMP/release.p12 -Pwolp.signing.storePassword=ci-pass -Pwolp.signing.keyAlias=wolp -Pwolp.signing.keyPassword=ci-pass -Pwolp.expectedSigningDigests=$DIGEST"
          if ./gradlew --no-daemon -q $WOLP $SIGN :app:verifyPilotReleaseBuildKind; then
            echo "verifyPilotReleaseBuildKind accepted a release without wolp.googleServices"; exit 1; fi
          SIGN="$SIGN -Pwolp.googleServices=$RUNNER_TEMP/google-services.json"
          # secret chats: a root without the list of issuers is refused; the release builds carry both
          if ./gradlew --no-daemon -q $WOLP -Pwolp.e2eeRoot=../../p1/stand/devices/pki/stand-root.pem :app:validateWolpConfig; then
            echo "validateWolpConfig accepted wolp.e2eeRoot without wolp.e2eeIssuers"; exit 1; fi
          SIGN="$SIGN -Pwolp.e2eeRoot=../../p1/stand/devices/pki/stand-root.pem -Pwolp.e2eeIssuers=$(printf 'ab%.0s' {1..32})"
          ./gradlew --no-daemon $WOLP $SIGN :app:assembleProductRelease :app:assemblePilotRelease
          # refused: product in the pilot versionCode range; signer not in expectedSigningDigests; stand host
          if ./gradlew --no-daemon -q $WOLP $SIGN -Pwolp.productVersionCode=10095 :app:verifyProductReleaseBuildKind; then
            echo "verifyProductReleaseBuildKind accepted a pilot-range versionCode"; exit 1; fi
          if ./gradlew --no-daemon -q $WOLP $SIGN -Pwolp.expectedSigningDigests=$(printf '00%.0s' {1..32}) :app:verifyPilotReleaseBuildKind; then
            echo "verifyPilotReleaseBuildKind accepted a foreign signer"; exit 1; fi
          if ./gradlew --no-daemon -q $WOLP $SIGN -Pwolp.appUrl=https://localhost:9444 :app:verifyProductReleaseBuildKind; then
            echo "verifyProductReleaseBuildKind accepted the stand host"; exit 1; fi
          # packaged UI: a build for another API origin and a cross-site uiHost are refused; no service worker in the APK
          if ./gradlew --no-daemon -q $WOLP -Pwolp.appUrl=https://app2.ci.invalid :app:bundleProductDebugWebUi; then
            echo "bundleProductDebugWebUi accepted a UI built for another API origin"; exit 1; fi
          if ./gradlew --no-daemon -q $WOLP -Pwolp.uiHost=ui.example.org :app:validateWolpConfig; then
            echo "validateWolpConfig accepted a cross-site uiHost"; exit 1; fi
          for apk in app/build/outputs/apk/*/release/*.apk; do
            unzip -l "$apk" | grep -q 'assets/public/index.html' || { echo "$apk: no packaged UI"; exit 1; }
            if unzip -l "$apk" | grep -q 'push-sw.js'; then echo "$apk: service worker script packaged"; exit 1; fi
          done
          for apk in app/build/outputs/apk/*/release/*.apk; do
            # libwolpdt.so stripped by the app's NDK (API.md §1)
            unzip -p "$apk" lib/arm64-v8a/libwolpdt.so > "$RUNNER_TEMP/libwolpdt.so"
            file "$RUNNER_TEMP/libwolpdt.so" | tee /dev/stderr | grep -q ', stripped'
          done
          for apk in app/build/outputs/apk/*/release/*.apk; do
            # libsignal: 64-bit ARM only, without its test library and its desktop builds (wolp-device-trust API.md §1)
            unzip -l "$apk" | grep -q 'lib/arm64-v8a/libsignal_jni.so' || { echo "$apk: no libsignal"; exit 1; }
            if unzip -l "$apk" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/|libsignal_jni_testing|\.dylib|\.dll'; then echo "$apk: files that must not ship"; exit 1; fi
          done
          # no stand trust anchor outside debug (S1 §4.3); checked on the generated sources, as release
          # resource paths are shortened in the APK
          if ls app/build/generated/wolp-nsc/*Release/raw 2>/dev/null; then echo "release NSC carries an extra trust anchor"; exit 1; fi
