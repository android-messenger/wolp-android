# Drop any client-supplied identity headers on the way in. An empty value makes
# nginx NOT pass the header to the upstream. Only Oathkeeper (after validating
# the Kratos session) is allowed to set these — this prevents spoofing.
proxy_set_header X-User-Id "";
proxy_set_header X-User "";
proxy_set_header X-Role "";
proxy_set_header X-User-Email "";
proxy_set_header X-User-Verified "";
