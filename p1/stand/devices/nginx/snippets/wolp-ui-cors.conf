# security/09 (UI packaged into the APK): the app's UI runs on its own local origin
# (https://<uiHost>, same site as app.<host>) and calls app.<host> cross-origin with the
# Kratos cookie. Every location the UI reaches — the 401/403 of auth_request included, or
# fetch() sees a network error instead of the status — includes this. $wolp_ui_origin is
# empty for any other Origin, and empty values are not sent. Upstream CORS headers
# (Kratos has its own list) are dropped so only one set reaches the client.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
add_header Access-Control-Allow-Origin      $wolp_ui_origin always;
add_header Access-Control-Allow-Credentials $wolp_ui_credentials always;
add_header Access-Control-Expose-Headers    $wolp_ui_expose always;
add_header Vary Origin always;
