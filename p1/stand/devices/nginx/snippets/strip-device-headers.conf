# S3 §10, S3-N2: client-supplied X-Device-* / X-Client-* never reach an upstream.
# The existing strip-identity-headers.conf is not changed (rule: additive only);
# this snippet is included next to it. An empty value makes nginx drop the header.
proxy_set_header X-Device-Id          "";
proxy_set_header X-Device-User        "";
proxy_set_header X-Device-Renew       "";
proxy_set_header X-Device-Deny        "";
proxy_set_header X-Client-Verify      "";
proxy_set_header X-Client-Serial      "";
proxy_set_header X-Client-Fingerprint "";
