# Presigned MinIO URLs (messenger MINIO_ENDPOINT = https://localhost:9444): SigV4 signs the Host, so
# MinIO must see that host whichever stand port the client used (production: one edge host).
client_max_body_size 0;
proxy_request_buffering off;
proxy_set_header Host localhost:9444;
proxy_pass http://minio:9000;
