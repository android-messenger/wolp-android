# Inside the messenger container's network namespace (service minio-loopback,
# network_mode: service:messenger): the backend reaches MinIO at the SAME endpoint it
# signs into presigned URLs for clients (MINIO_ENDPOINT=https://localhost:9444) — the
# backend knows one endpoint for itself and for clients (split-horizon). TLS with the
# stand server certificate (the messenger JVM trusts the stand root: out/stand-trust.p12).
events {}
http {
  access_log off;
  server {
    listen 127.0.0.1:9444 ssl;
    listen [::1]:9444 ssl;
    ssl_certificate     /pki/server-chain.pem;
    ssl_certificate_key /pki/server.key;
    client_max_body_size 0;
    proxy_request_buffering off;
    location / {
      proxy_set_header Host localhost:9444;   # SigV4 signs the Host
      proxy_pass http://minio:9000;
    }
  }
}
