# Enroll host of S3 §10, reduced to what the stand needs. TLS terminates here with
# a server certificate from pki/stand-root (trusted by the debug sample for localhost only).
events {}
http {
  upstream kratosgate_devices { server kratosgate:8091; }
  server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;
    ssl_certificate     /pki/server-chain.pem;
    ssl_certificate_key /pki/server.key;
    ssl_protocols TLSv1.3;
    client_max_body_size 64k;

    location /v1/enroll/          { proxy_set_header X-Real-IP $remote_addr; proxy_pass http://kratosgate_devices; }
    location /v1/device/reattest/ { proxy_set_header X-Real-IP $remote_addr; proxy_pass http://kratosgate_devices; }
    location = /v1/device/alert   { proxy_set_header X-Real-IP $remote_addr; proxy_pass http://kratosgate_devices; }
    location /                    { return 404; }
  }
}
