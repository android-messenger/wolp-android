# Devices stand nginx (S3 §10), reduced to what the stand needs. TLS terminates here
# with a server certificate from pki/stand-root (trusted by the debug sample for
# localhost only). Two servers, told apart by port instead of host name:
#   8443 — enroll.<host>: no client certificate;
#   8444 — app.<host>: mTLS with the device CA, every request through auth_request.
events {}
http {
  log_format stand '$remote_addr :$server_port "$request" $status $body_bytes_sent verify=$ssl_client_verify serial=$ssl_client_serial ua="$http_user_agent"';
  access_log /dev/stdout stand;
  error_log  /dev/stderr info;   # TLS handshake failures are logged at info
  upstream kratosgate_devices { server kratosgate:8091; keepalive 16; }
  upstream oathkeeper         { server oathkeeper:4455; }

  # ---------- enroll.<host> ----------
  server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;
    ssl_certificate     /pki/server-chain.pem;
    ssl_certificate_key /pki/server.key;
    ssl_protocols TLSv1.3;
    client_max_body_size 64k;

    location /v1/enroll/          { include snippets/strip-identity-headers.conf; include snippets/strip-device-headers.conf; proxy_set_header X-Real-IP $remote_addr; proxy_pass http://kratosgate_devices; }
    location /v1/device/reattest/ { include snippets/strip-identity-headers.conf; include snippets/strip-device-headers.conf; proxy_set_header X-Real-IP $remote_addr; proxy_pass http://kratosgate_devices; }
    location = /v1/device/alert   { include snippets/strip-identity-headers.conf; include snippets/strip-device-headers.conf; proxy_set_header X-Real-IP $remote_addr; proxy_pass http://kratosgate_devices; }
    # Kratos public API (same origin as the login page; S3 §10 routes it like this on enroll) and a
    # stand stand-in for messenger-ui's login page (S1 §3.1, step 6 of S1 §3)
    location /.ory/kratos/public/ { include snippets/strip-identity-headers.conf; include snippets/strip-device-headers.conf; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_pass http://kratos:4433/; }
    location = /messenger-ui/login { alias /usr/share/nginx/stand-ui/login.html; default_type text/html; add_header Cache-Control no-store; }
    location /                    { return 404; }
  }

  # ---------- app.<host> ----------
  server {
    listen 8444 ssl;
    http2 on;
    server_name localhost;
    ssl_certificate     /pki/server-chain.pem;
    ssl_certificate_key /pki/server.key;
    ssl_protocols TLSv1.3;
    client_max_body_size 64k;
    ssl_client_certificate /pki/device-ca-bundle.pem;   # device root + intermediate
    ssl_verify_client on;
    ssl_verify_depth 2;
    # A resumed TLS session keeps the old client identity: no tickets, short cache (S3 §10).
    ssl_session_tickets off;
    ssl_session_timeout 5m;

    location = /_device_check {
      internal;
      auth_request off;              # otherwise the check subrequest checks itself
      proxy_pass http://kratosgate_devices/internal/device/check;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Client-Verify      $ssl_client_verify;
      proxy_set_header X-Client-Serial      $ssl_client_serial;
      proxy_set_header X-Client-Fingerprint $ssl_client_fingerprint;
      proxy_set_header X-Original-URI       $request_uri;
      proxy_set_header X-Original-Method    $request_method;
      proxy_set_header Cookie               $http_cookie;
    }

    # common to every location below
    auth_request /_device_check;
    auth_request_set $dt_device $upstream_http_x_device_id;
    auth_request_set $dt_deny   $upstream_http_x_device_deny;
    auth_request_set $dt_renew  $upstream_http_x_device_renew;
    error_page 401 = @dt_401;
    error_page 403 = @dt_403;

    # The module answers /v1/device/* itself, with its own X-Device-Renew (ping)
    # and X-Device-Deny (renew refusals): wolp-device-headers.conf is NOT included
    # here, or the headers would come twice / be overwritten.
    location /v1/device/ {
      include snippets/strip-identity-headers.conf;
      include snippets/strip-device-headers.conf;
      proxy_set_header X-Client-Verify $ssl_client_verify;
      proxy_set_header X-Client-Serial $ssl_client_serial;
      proxy_pass http://kratosgate_devices;
    }
    # Everything else: Oathkeeper (session → X-User-Id) → backend, with X-Device-Id
    # from auth_request. In production also /messenger-ui/, /.ory/kratos/public/, …
    location / {
      include snippets/wolp-device-headers.conf;
      include snippets/strip-identity-headers.conf;
      include snippets/strip-device-headers.conf;
      proxy_set_header X-Device-Id $dt_device;
      proxy_pass http://oathkeeper;
    }
    location @dt_401 { auth_request off; default_type application/json; add_header X-Device-Deny $dt_deny always; return 401 '{"error":"$dt_deny"}'; }
    location @dt_403 { auth_request off; default_type application/json; add_header X-Device-Deny $dt_deny always; return 403 '{"error":"$dt_deny"}'; }
  }
}
