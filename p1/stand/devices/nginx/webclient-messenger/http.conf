# Messenger mode: the web client's upstream and a browser host (web.<host>, port 8445 → 9445 on
# the machine) without mTLS — the main host of production, for a second user in a desktop browser.
# Not the D17 browser check: that host is out of the stand's scope.
upstream front4mess { server front4mess:5555; }

server {
  listen 8445 ssl;
  http2 on;
  server_name localhost;
  ssl_certificate     /pki/server-chain.pem;
  ssl_certificate_key /pki/server.key;
  ssl_protocols TLSv1.3;
  client_max_body_size 1m;

  location = / { return 302 /messenger-ui/; }
  location /messenger-ui/ {
    include snippets/strip-identity-headers.conf;
    include snippets/strip-device-headers.conf;
    proxy_pass http://front4mess/;
  }
  location /.ory/kratos/public/ {
    include snippets/strip-identity-headers.conf;
    include snippets/strip-device-headers.conf;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://kratos:4433/;
  }
  location /messenger-attachments { include snippets/stand-attachments.conf; }
  location /v1/ { return 404; }
  location / {
    include snippets/strip-identity-headers.conf;
    include snippets/strip-device-headers.conf;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_pass http://oathkeeper;
  }
}
