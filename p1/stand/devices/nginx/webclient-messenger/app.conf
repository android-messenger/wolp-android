# Messenger mode, app.<host> (mTLS + auth_request inherited from the server): the live messenger-ui
# build, the Kratos public API on the same origin (S3 §10), presigned attachment URLs → MinIO.
# The probe stays reachable at /probe/.
location /messenger-ui/ {
  include snippets/wolp-device-headers.conf;
  include snippets/strip-identity-headers.conf;
  include snippets/strip-device-headers.conf;
  proxy_pass http://front4mess/;
}
location /probe/ {
  include snippets/wolp-device-headers.conf;
  alias /usr/share/nginx/stand-ui/app/;
  index index.html;
  add_header Cache-Control no-store always;
}
location /.ory/kratos/public/ {
  include snippets/wolp-device-headers.conf;
  include snippets/strip-identity-headers.conf;
  include snippets/strip-device-headers.conf;
  proxy_set_header X-Forwarded-Proto https;
  proxy_pass http://kratos:4433/;
}
location /messenger-attachments {
  include snippets/wolp-device-headers.conf;
  include snippets/stand-attachments.conf;
}
