# Stand Kratos: password login only, no hooks. The host scripts log in through the browser
# flow directly on :4433 and hand the session cookie to the phone; the app (S1) logs in through
# nginx on the enroll host (/.ory/kratos/public/ + the stand login page), hence the public base_url.
version: v1.3.0
serve:
  public: { base_url: "https://localhost:9443/.ory/kratos/public/" }
  admin: { base_url: "http://kratos:4434/" }
identity:
  default_schema_id: default
  schemas: [{ id: default, url: "file:///etc/config/kratos/identity.schema.json" }]
selfservice:
  default_browser_return_url: "http://127.0.0.1:4433/"
  allowed_return_urls: ["http://127.0.0.1:4433/"]
  methods: { password: { enabled: true } }
  flows:
    login: { ui_url: "http://127.0.0.1:4433/ui/login" }
    error: { ui_url: "http://127.0.0.1:4433/ui/error" }
secrets:
  cookie: ["stand-cookie-secret-not-for-production"]
  cipher: ["0123456789abcdef0123456789abcdef"]
courier: { smtp: { connection_uri: "smtp://none:none@localhost:25/?disable_starttls=true" } }
log: { level: info, format: text }
