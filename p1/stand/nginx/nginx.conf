# P1 stand: mirrors S3 §app/enroll layout (mTLS only on app.<host>), without KratosGate/auth_request.
events {}
http {
  log_format p1 escape=json '{"t":"$time_iso8601","host":"$host","req":"$request","status":$status,'
                            '"serial":"$ssl_client_serial","verify":"$ssl_client_verify",'
                            '"reused":"$ssl_session_reused","sid":"$ssl_session_id","conn":"$connection",'
                            '"upgrade":"$http_upgrade","ua":"$http_user_agent"}';
  access_log /dev/stdout p1;
  error_log  /dev/stderr info;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  ssl_certificate     /pki/server-chain.pem;
  ssl_certificate_key /pki/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  upstream probe { server probe:8080; }

  # ---------- enroll.<host>: plain TLS ----------
  server {
    listen 443 ssl; http2 on;
    server_name enroll.*;
    location / {
      proxy_pass http://probe;
      proxy_set_header Host $host;
      proxy_set_header X-P1-Serial "";
      proxy_set_header X-P1-Reused $ssl_session_reused;
    }
  }

  # ---------- app.<host>: mTLS, as in S3 ----------
  server {
    listen 443 ssl; http2 on;
    server_name app.*;
    ssl_client_certificate /pki/device-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_session_tickets off;
    ssl_session_timeout 5m;

    location / {
      proxy_pass http://probe;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-P1-Serial $ssl_client_serial;
      proxy_set_header X-P1-Verify $ssl_client_verify;
      proxy_set_header X-P1-Reused $ssl_session_reused;
      proxy_read_timeout 1h;
    }
  }
}
